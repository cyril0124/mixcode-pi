name: Regression

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Key covers patches/** so a patch change busts the install cache.
      # No restore-keys: a partial hit would restore a mismatched lock/patch pair.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'patches/**') }}

      # bun install applies patchedDependencies; postinstall only runs the
      # non-TTY extension installer and never fails the parent install.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tests need fd on PATH for Pi @ file completion (Bun.which("fd") and
      # ensureTool("fd")); apt's fd-find ships the binary as fdfind, so link
      # the canonical name instead of relying on Pi's GitHub download in CI.
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Root tests
        run: |
          chmod +x scripts/ci-observer.sh
          nohup bash scripts/ci-observer.sh "$RUNNER_TEMP/observer.log" >/dev/null 2>&1 &
          echo "observer pid $!"
          bun run test

      - name: Package tests
        run: bun run test:packages

      - name: Dump observer log
        if: always()
        run: |
          pkill -f ci-observer.sh || true
          tail -n 4000 "$RUNNER_TEMP/observer.log" || true

      - name: Upload observer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observer-log
          path: ${{ runner.temp }}/observer.log
          if-no-files-found: ignore
