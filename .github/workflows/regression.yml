name: Regression

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.4.2

      # The root lock pins local fork-backed extension test dependencies.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      # Tests need fd on PATH for Pi @ file completion (Bun.which("fd") and
      # ensureTool("fd")); apt's fd-find ships the binary as fdfind, so link
      # the canonical name instead of relying on Pi's GitHub download in CI.
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Verify fork-backed build and extension tests
        run: bun run check
