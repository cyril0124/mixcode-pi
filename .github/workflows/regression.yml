name: Regression

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # postinstall applies patches (patch-package --error-on-fail) and skips
      # the interactive extension installer in non-TTY environments.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Tests need fd on PATH for Pi @ file completion (Bun.which("fd") and
      # ensureTool("fd")); apt's fd-find ships the binary as fdfind, so link
      # the canonical name instead of relying on Pi's GitHub download in CI.
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Root tests
        run: bun run test

      - name: Package tests
        run: bun run test:packages
