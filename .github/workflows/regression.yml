name: Regression

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.4.1

      # Key covers patches/** so a patch change busts the install cache.
      # No restore-keys: a partial hit would restore a mismatched lock/patch pair.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'patches/**') }}

      # bun install applies patchedDependencies; postinstall only runs the
      # non-TTY extension installer and never fails the parent install.
      - name: Install dependencies
        run: bun install --frozen-lockfile --prefer-offline

      # Tests need fd on PATH for Pi @ file completion (Bun.which("fd") and
      # ensureTool("fd")); apt's fd-find ships the binary as fdfind, so link
      # the canonical name instead of relying on Pi's GitHub download in CI.
      - name: Install fd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fd-find
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Root tests
        run: bun run test

      - name: Package tests
        run: bun run test:packages
