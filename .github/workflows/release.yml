name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: 1.4.2

      # release.sh builds the pinned fork and cross-compiles all
      # default targets (linux x64/arm64, darwin arm64/x64) on this runner.
      - name: Build binaries
        run: ./release.sh --out-dir dist/release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Idempotent on re-run: create the release, or overwrite assets if it exists.
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --generate-notes ||
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
